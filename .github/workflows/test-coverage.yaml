# Measures test coverage with covr and uploads it to Codecov with the
# repository's CODECOV_TOKEN secret. This job installs ffmpeg, LaTeX with
# dvisvgm, and Typst, so the tests that need them run here (R-CMD-check
# runs without them).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Install ffmpeg and Pygments
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pygments

      - uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Install LaTeX packages and dvisvgm
        run: |
          tlmgr install babel-english lm amsmath amsfonts doublestroke setspace tipa \
            relsize jknapltx rsfs calligra wasysym ragged2e physics xcolor microtype \
            preview standalone dvisvgm frcursive mathastext eulervm ec cm-super
          dvisvgm --version

      - name: Install typst
        run: |
          curl -sSL -o "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Check the tools
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          latex --version | head -1
          typst --version

      - name: Measure coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
