url: https://adamrsophie.github.io/manimR/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#236B8E"
    base_font: {google: "Inter"}
    heading_font: {google: "Space Grotesk"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "manimR: Mathematical Animation in Native R"
  description: >
    A native R port of Manim Community: build scenes from vectorized
    mobjects, animate them, and render videos, GIFs and images.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, lightswitch, github]

articles:
- title: Basics
  navbar: Basics
  contents:
